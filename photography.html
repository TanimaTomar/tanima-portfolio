<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photography — tanima</title>
  <meta name="description" content="A small set of photographs from around campus by Tanima Tomar." />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <div class="page">

    <header class="work-header">
      <div class="work-heading">
        <a href="work.html" class="back-link" aria-label="Back to work">
          <span class="back-link-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M14 6l-6 6 6 6" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
        </a>
        <h1 class="work-title">Photography</h1>
      </div>
    </header>

    <div class="illustration-panel">
      <p class="photo-subtitle">Same campus. I just kept noticing something new about it.</p>

      <div class="photo-grid">
        <div class="photo-sizer"></div>

        <div class="photo-item">
          <img
            src="assets/img/photography/photo-1.jpg"
            alt="Night view of a red-brick Gothic Revival building with a lit rose window and clock tower, an empty street in front"
          />
        </div>
        <div class="photo-item">
          <img
            src="assets/img/photography/photo-2.jpg"
            alt="A red-brick Gothic Revival clock tower glowing orange at dusk against a cloudy sky"
          />
        </div>
        <div class="photo-item">
          <img
            src="assets/img/photography/photo-3.jpg"
            alt="Looking straight up into a domed rotunda ceiling with a circular skylight and a chandelier"
          />
        </div>
        <div class="photo-item">
          <img
            src="assets/img/photography/photo-4.jpg"
            alt="Looking down a white wooden staircase and railing toward the floor below, with a wooden handrail in the foreground"
          />
        </div>
      </div>

      <div class="photo-single">
        <img
          src="assets/img/photography/photo-5.jpg"
          alt="A campus building with a red-domed clock tower, seen past a dark wrought-iron lamppost in the foreground under a clear blue sky"
        />
      </div>
    </div>

    <div class="work-closing-block">
      <p class="work-closing">That's what caught my eye.<br />Back to the actual work.</p>

      <a href="work.html" class="back-link">
        <span class="back-link-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M14 6l-6 6 6 6" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </span>
        <span class="back-link-text" data-text="Work">Work</span>
      </a>
    </div>

  </div>

  <script src="assets/js/vendor/imagesloaded.pkgd.min.js"></script>
  <script src="assets/js/vendor/masonry.pkgd.min.js"></script>
  <script src="assets/js/photography-masonry.js"></script>
  <script src="assets/js/background-effect.js"></script>
  <script src="assets/js/page-transition.js"></script>
</body>
</html>
