<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Illustration — tanima</title>
  <meta name="description" content="A small range of illustration work by Tanima Tomar — ink comics, watercolor, and character work." />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <div class="page">

    <header class="work-header">
      <div class="work-heading">
        <a href="work.html" class="back-link" aria-label="Back to work">
          <span class="back-link-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M14 6l-6 6 6 6" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </span>
        </a>
        <h1 class="work-title">Illustration</h1>
      </div>

      <div class="work-avatar-wrap">
        <img class="work-avatar" src="assets/img/illustration/Top.png" alt="Illustrated self-portrait, wrapped in a blue blanket" />
        <span class="thought-bubble thought-bubble--1" aria-hidden="true"></span>
        <span class="thought-bubble thought-bubble--2" aria-hidden="true"></span>
        <span class="thought-bubble thought-bubble--3" aria-hidden="true"></span>
      </div>
    </header>

    <div class="illustration-panel">
      <div class="illustration-grid">
        <div class="illustration-sizer"></div>

        <div class="illustration-item">
          <img
            src="assets/img/illustration/1.png"
            alt="A page of black-and-white ink panel illustrations, including a birdcage, a jester labeled Joker, and a revolver"
          />
        </div>
        <div class="illustration-item">
          <img
            src="assets/img/illustration/2.png"
            alt="Watercolor illustration of a moonlit dreamscape with a sun, waves, and mushrooms"
          />
        </div>
        <div class="illustration-item">
          <img
            src="assets/img/illustration/3.png"
            alt="Watercolor illustration of hot air balloons rising over a small village"
          />
        </div>
        <div class="illustration-item">
          <img
            src="assets/img/illustration/4.png"
            alt="Watercolor illustration of a girl reaching up toward a rainbow, standing among flowers"
          />
        </div>
        <div class="illustration-item">
          <img
            src="assets/img/illustration/5.png"
            alt="Ink illustration of a character skating inside a circular frame"
          />
        </div>
        <div class="illustration-item">
          <img
            src="assets/img/illustration/6.png"
            alt="Watercolor illustration of a baby sleeping inside a poppy flower, lit by a lamp"
          />
        </div>
      </div>
    </div>

    <div class="work-closing-block">
      <p class="work-closing">That's the range, thanks for looking.</p>

      <a href="work.html" class="back-link">
        <span class="back-link-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M14 6l-6 6 6 6" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </span>
        <span class="back-link-text" data-text="Work">Work</span>
      </a>
    </div>

  </div>

  <script src="assets/js/vendor/imagesloaded.pkgd.min.js"></script>
  <script src="assets/js/vendor/masonry.pkgd.min.js"></script>
  <script src="assets/js/illustration-masonry.js"></script>
  <script src="assets/js/background-effect.js"></script>
  <script src="assets/js/page-transition.js"></script>
</body>
</html>
